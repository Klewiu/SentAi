<div class="space-y-1.5">
    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
    {{ field }}
    {% if field.help_text %}<p class="field-help text-xs text-slate-500" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</p>{% endif %}
    {% if field.errors %}<p class="text-sm text-rose-700" id="{{ field.auto_id }}_error" role="alert">{{ field.errors|striptags }}</p>{% endif %}
</div>
