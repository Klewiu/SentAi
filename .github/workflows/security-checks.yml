name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python manage.py makemigrations --check --dry-run --settings=sentai.settings.test
      - run: python manage.py test --settings=sentai.settings.test --noinput
      - run: python -m pip_audit -r requirements.lock --disable-pip --no-deps
